version: "v0.4"
project:
  name: "Three gauge-coupling windows isolate the roots of x³ − x − 1 and x⁴ − x − 1 in bounded polynomial families"
  description: >-
    Let ρ and Q be the roots greater than one of x³ − x − 1 and x⁴ − x − 1.
    We classify the ordered triples (a,b,p) in three inequalities motivated by
    the inverse fine-structure constant, the weak mixing angle and the strong
    coupling, with p any natural number. For real roots of monic integer
    polynomials drawn from the same family, the unique passing triple is
    (ρ,Q,15) when the degree and coefficient height bounds are (4,3) or (6,2).
    Both families include reducible polynomials of degree at least two with
    nonzero constant term. The same triple is the unique solution when a and b
    are roots of an irreducible monic cubic and quartic, respectively, of
    height at most ten, with the product ab of norm −1 in ℚ(a,b) over ℚ.
    Two explicit quartics show where this classification fails. One gives
    a second pair at height eleven with the same norm. The other gives a
    second pair at height ten with product norm +1. Both pass at p = 15.
  authors: ["Stephanie Alexander"]
  responsible_maintainers: ["Stephanie Alexander"]
  license: "MIT"
