status:
  scope: >-
    Two exact classifications and two existential counterexamples. Cell
    membership refers to witness-polynomial height. Cubic and quartic
    irreducibility in the norm family is over ℚ. The counterexamples assert
    a passing second coordinate satisfying b⁴ ≠ b + 1. The proofs identify
    explicit witness polynomials and isolate the relevant roots.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
fidelity:
  divergences: >-
    The source script searches a finite list under strict tests. The two
    classifications give exact equivalences on the indicated algebraic
    classes using closed windows at the stated rational decimals. The
    physical identification of the three functions motivates these
    definitions. The formal claims concern real inequalities and field norms.
